nment for the rest of the day.","tr":"오늘 나머지 시간에는 이 업무를 작업해 주십시오.","lv":"중급","topic":"TOEIC 기출 어휘","priority":"A","source":"9월 6일 100단어.pdf; 10월 11일 100단어.pdf; 11월 8일 100단어.pdf"},{"w":"melt","p":"동사","m":"녹다","ipa":"","phrase":"","ex":"The ice cream will melt if you leave it in the sun.","tr":"아이스크림을 햇볕에 두면 녹을 것이다.","lv":"중급","topic":"TOEIC 기출 어휘","priority":"A","source":"9월 6일 100단어.pdf"},{"w":"signature","p":"명사","m":"서명","ipa":"","phrase":"","ex":"Each page of the contract requires a signature.","tr":"그 계약서의 각 페이지는 서명이 필요하다.","lv":"중급","topic":"TOEIC 기출 어휘","priority":"A","source":"9월 6일 100단어.pdf"},{"w":"defectively","p":"부사","m":"결함 있게","ipa":"","phrase":"","ex":"The machine was manufactured defectively and had to be recalled.","tr":"그 기계는 결함 있게 제조되어 리콜되어야 했다.","lv":"중급","topic":"TOEIC 기출 어휘","priority":"A","source":"9월 6일 100단어.pdf"},{"w":"lift","p":"동사","m":"들어 올리다","ipa":"","phrase":"","ex":"The worker lifted the boxes off the truck.","tr":"그 인부는 트럭에서 상자들을 들어 올려서 내렸다.","lv":"중급","topic":"TOEIC 기출 어휘","priority":"A","source":"9월 6일 100단어.pdf"},{"w":"seasoned","p":"형용사","m":"숙련된, 양념을 한","ipa":"","phrase":"","ex":"The firm hired a seasoned accountant to handle the complex tax issues.","tr":"그 회사는 복잡한 세금 문제를 처리하기 위해 숙련된 회계사를 고용했다.","lv":"중급","topic":"TOEIC 기출 어휘","priority":"A","source":"9월 6일 100단어.pdf"},{"w":"soft drink","p":"구문","m":"청량음료","ipa":"","phrase":"","ex":"Kerry Company is best known for its flavored soft drinks.","tr":"는 향을 첨가한 청량음료로 가장 잘 알려져 있다.","lv":"중급","topic":"TOEIC 기출 어휘","priority":"A","source":"9월 6일 100단어.pdf"},{"w":"publication","p":"명사","m":"간행물, 출판(물)","ipa":"","phrase":"","ex":"Subscribers receive a copy of the publication once a month.","tr":"구독자들은 한 달에 한 번 간행물 한 부를 받는다.","lv":"중급","topic":"TOEIC 기출 어휘","priority":"A","source":"9월 6일 100단어.pdf"},{"w":"depend on","p":"구문","m":"~에 의지하다","ipa":"","phrase":"","ex":"She often depends on the advice of her former supervisor.","tr":"그녀는 종종 전 관리자의 조언에 의지한다.","lv":"중급","topic":"TOEIC 기출 어휘","p :"창고 관리자는 재고 수준을 점검할 책임이 있습니다.","source":"자체 제작 연습문제"},{"q":"All applications received after the deadline will be _____.","a":["consider","consideration","considered","considering"],"c":2,"t":"수동태","e":"지원서는 심사되는 대상이므로 will be considered가 맞습니다.","tr":"마감일 이후 접수된 모든 지원서는 심사될 것입니다.","source":"자체 제작 연습문제"},{"q":"The seminar is open to employees _____ have completed the online course.","a":["whose","which","who","whom"],"c":2,"t":"관계대명사","e":"사람을 선행사로 하고 뒤에 동사 have completed가 이어지므로 주격 who가 필요합니다.","tr":"세미나는 온라인 과정을 완료한 직원에게 개방됩니다.","source":"자체 제작 연습문제"},{"q":"The company will provide a replacement _____ the product is defective.","a":["if","despite","during","because of"],"c":0,"t":"접속사","e":"조건을 나타내며 뒤에 절이 오므로 if가 정답입니다.","tr":"제품에 결함이 있으면 회사가 교환품을 제공할 것입니다.","source":"자체 제작 연습문제"},{"q":"The instructions were written _____ so that every employee could understand them.","a":["clear","clearly","clearness","clearing"],"c":1,"t":"품사","e":"동사 were written을 수식하는 부사 clearly가 필요합니다.","tr":"모든 직원이 이해할 수 있도록 지침은 명확하게 작성되었습니다.","source":"자체 제작 연습문제"},{"q":"The finance department has not yet _____ the travel expenses.","a":["reimburse","reimbursed","reimbursing","reimbursement"],"c":1,"t":"시제·동사형태","e":"현재완료 has not yet 뒤에는 과거분사 reimbursed가 옵니다.","tr":"재무 부서는 아직 출장 경비를 상환하지 않았습니다.","source":"자체 제작 연습문제"},{"q":"The manager approved the request, _____ the additional cost.","a":["despite","although","because","unless"],"c":0,"t":"전치사","e":"뒤에 명사구 the additional cost가 오므로 despite가 맞습니다.","tr":"추가 비용에도 불구하고 관리자는 요청을 승인했습니다.","source":"자체 제작 연습문제"},{"q":"A copy of the receipts _____ required for reimbursement.","a":["are","were","is","have"],"c":2,"t":"수일치","e":"주어의 핵심은 단수 명사 A copy이므로 is가 정답입니다.","tr":"경비 상환을 위해 영수증 사본 한 부가 필요합니다.","source":"자체 제작 연습문제"},{"q":"The store is offering a special promotion _____ the month of June.","a":["throughout","between","since","among"],"c":0,"t":"전치사","e":"throughout the month는 한 달 내내라는 뜻입니다.","tr":"매장은 6월 한 달 내내 특별 판촉 행사를 진행합니다.","source":"자체 제작 연습문제"},{"q":"The director asked the assistant _____ the reservation.","a":["confirm","confirming","to confirm","confirmed"],"c":2,"t":"준동사","e":"ask + 목적어 + to부정사 구조입니다.","tr":"이사는 비서에게 예약을 확인해 달라고 요청했습니다.","source":"자체 제작 연습문제"},{"q":"The proposal includes several recommendations, all of _____ were accepted.","a":["them","which","that","what"],"c":1,"t":"관계대명사","e":"전치사 of 뒤에서 앞 문장 내용을 받는 목적격 관계대명사 which가 필요합니다.","tr":"제안서에는 여러 권고 사항이 포함되어 있었고, 그 모두가 받아들여졌습니다.","source":"자체 제작 연습문제"},{"q":"The office will be closed on Friday _____ a public holiday.","a":["because","due to","although","whereas"],"c":1,"t":"전치사","e":"due to 뒤에는 명사구 a public holiday가 옵니다.","tr":"공휴일로 인해 사무실은 금요일에 문을 닫습니다.","source":"자체 제작 연습문제"},{"q":"The training session is intended _____ new employees with company procedures.","a":["familiarize","familiarizing","to familiarize","familiarity"],"c":2,"t":"준동사","e":"be intended to + 동사원형 구조입니다.","tr":"교육 세션은 신입 직원에게 회사 절차를 익히게 하기 위한 것입니다.","source":"자체 제작 연습문제"},{"q":"The company has introduced a system that processes orders more _____.","a":["efficient","efficiency","efficiently","efficientness"],"c":2,"t":"품사","e":"동사 processes를 수식하는 부사 efficiently가 정답입니다.","tr":"회사는 주문을 더 효율적으로 처리하는 시스템을 도입했습니다.","source":"자체 제작 연습문제"},{"q":"_____ the high demand, the manufacturer increased production.","a":["Because","Due to","Although","Despite of"],"c":1,"t":"전치사·접속사","e":"뒤에 명사구 the high demand가 오므로 Due to가 맞습니다.","tr":"높은 수요 때문에 제조업체는 생산량을 늘렸습니다.","source":"자체 제작 연습문제"},{"q":"The updated catalog contains prices that are valid _____ December 31.","a":["through","among","between","since"],"c":0,"t":"전치사","e":"valid through December 31은 12월 31일까지 유효하다는 뜻입니다.","tr":"업데이트된 카탈로그에는 12월 31일까지 유효한 가격이 실려 있습니다.","source":"자체 제작 연습문제"},{"q":"The marketing team is considering _____ a new advertising campaign.","a":["launch","launched","launching","to launch"],"c":2,"t":"준동사","e":"consider는 목적어로 동명사를 취합니다.","tr":"마케팅 팀은 새로운 광고 캠페인을 시작하는 것을 고려하고 있습니다.","source":"자체 제작 연습문제"},{"q":"The final version of the manual _____ to all branches yesterday.","a":["send","sent","was sent","has sending"],"c":2,"t":"수동태·시제","e":"manual은 보내지는 대상이며 yesterday가 있으므로 was sent입니다.","tr":"설명서 최종본은 어제 모든 지점에 발송되었습니다.","source":"자체 제작 연습문제"},{"q":"Employees should keep their passwords _____ at all times.","a":["secure","security","securely","securing"],"c":0,"t":"품사·목적격 보어","e":"keep + 목적어 + 형용사 구조로 passwords의 상태를 설명하는 secure가 정답입니다.","tr":"직원들은 항상 비밀번호를 안전하게 유지해야 합니다.","source":"자체 제작 연습문제"},{"q":"The conference attracted speakers from _____ industries.","a":["vary","variety","various","variously"],"c":2,"t":"품사","e":"명사 industries를 수식하는 형용사 various가 필요합니다.","tr":"그 회의에는 다양한 산업 분야의 발표자들이 참석했습니다.","source":"자체 제작 연습문제"},{"q":"The contract may be terminated _____ either party fails to meet its obligations.","a":["if","despite","during","because of"],"c":0,"t":"접속사","e":"조건을 나타내는 절을 이끄는 if가 적절합니다.","tr":"어느 한쪽이 의무를 이행하지 못하면 계약이 종료될 수 있습니다.","source":"자체 제작 연습문제"},{"q":"The receptionist asked visitors to sign in _____ entering the building.","a":["prior to","because","although","whereas"],"c":0,"t":"전치사·구문","e":"prior to는 ~전에라는 뜻이며 동명사 entering을 취합니다.","tr":"접수 담당자는 방문객에게 건물에 들어가기 전에 방문 기록을 작성하라고 요청했습니다.","source":"자체 제작 연습문제"},{"q":"The survey results were _____ with those from the previous year.","a":["compare","comparison","comparable","comparably"],"c":2,"t":"품사","e":"be comparable with는 ~와 비교할 만하다는 표현으로 형용사가 필요합니다.","tr":"설문 결과는 전년도 결과와 비교할 만했습니다.","source":"자체 제작 연습문제"},{"q":"The new policy will affect all employees, _____ their job titles.","a":["regardless of","because","although","instead"],"c":0,"t":"전치사·구문","e":"regardless of는 ~에 관계없이를 의미합니다.","tr":"새 정책은 직함에 관계없이 모든 직원에게 영향을 미칠 것입니다.","source":"자체 제작 연습문제"},{"q":"The maintenance team completed the repairs more quickly than _____ .","a":["expect","expecting","expected","expectation"],"c":2,"t":"분사·비교","e":"than expected는 than it was expected의 축약 표현입니다.","tr":"유지 보수 팀은 예상보다 더 빨리 수리를 완료했습니다.","source":"자체 제작 연습문제"},{"q":"The director will review the budget _____ making a final decision.","a":["before","despite","because of","during"],"c":0,"t":"접속사","e":"뒤에 동명사 making이 오며 시간상 이전을 나타내는 before가 적절합니다.","tr":"이사는 최종 결정을 내리기 전에 예산을 검토할 것입니다.","source":"자체 제작 연습문제"},{"q":"The company’s newest model is _____ to operate than its predecessor.","a":["easy","easier","easiest","easily"],"c":1,"t":"비교급","e":"than이 있으므로 비교급 easier가 필요합니다.","tr":"회사의 최신 모델은 이전 모델보다 작동하기 쉽습니다.","source":"자체 제작 연습문제"},{"q":"The documents _____ on the desk belong to the human resources department.","a":["lie","lying","laid","to lie"],"c":1,"t":"분사·수식","e":"documents를 뒤에서 수식하는 현재분사 lying이 필요합니다.","tr":"책상 위에 놓여 있는 서류는 인사 부서 소속입니다.","source":"자체 제작 연습문제"},{"q":"The company decided to _____ the opening of its new facility.","a":["postpone","postponement","postponed","postponing"],"c":0,"t":"품사","e":"to 뒤에는 동사원형 postpone이 옵니다.","tr":"회사는 새 시설의 개장을 연기하기로 결정했습니다.","source":"자체 제작 연습문제"},{"q":"Please complete the form _____ and return it to the reception desk.","a":["accurate","accuracy","accurately","accurateness"],"c":2,"t":"품사","e":"동사 complete를 수식하는 부사 accurately가 정답입니다.","tr":"양식을 정확하게 작성한 후 접수 데스크에 제출해 주십시오.","source":"자체 제작 연습문제"},{"q":"The company provides free parking for employees _____ work after 8 P.M.","a":["who","whose","whom","which"],"c":0,"t":"관계대명사","e":"사람을 선행사로 하고 뒤에 동사 work가 이어지므로 주격 who가 필요합니다.","tr":"회사는 오후 8시 이후에 근무하는 직원에게 무료 주차를 제공합니다.","source":"자체 제작 연습문제"},{"q":"The shipment will be held at the warehouse _____ customs clearance is completed.","a":["until","during","among","between"],"c":0,"t":"접속사","e":"until은 어떤 상태가 완료 시점까지 지속됨을 나타냅니다.","tr":"통관이 완료될 때까지 배송품은 창고에 보관될 것입니다.","source":"자체 제작 연습문제"},{"q":"The manager praised the staff for their _____ response to the emergency.","a":["prompt","promptly","promptness","prompting"],"c":0,"t":"품사","e":"소유격 their 뒤 명사 response를 수식하는 형용사 prompt가 필요합니다.","tr":"관리자는 비상 상황에 신속하게 대응한 직원들을 칭찬했습니다.","source":"자체 제작 연습문제"},{"q":"The company will not issue a refund _____ the original receipt is provided.","a":["unless","because","despite","whereas"],"c":0,"t":"접속사","e":"unless는 ~하지 않는 한이라는 조건을 나타냅니다.","tr":"원본 영수증이 제출되지 않으면 회사는 환불하지 않을 것입니다.","source":"자체 제작 연습문제"},{"q":"The conference center is conveniently _____ near the central station.","a":["locate","located","locating","location"],"c":1,"t":"분사·수동태","e":"be located는 위치해 있다는 수동태 관용 표현입니다.","tr":"회의 센터는 중앙역 근처에 편리하게 위치해 있습니다.","source":"자체 제작 연습문제"},{"q":"The purchasing department selected the supplier _____ offered the lowest price.","a":["whose","who","which","whom"],"c":2,"t":"관계대명사","e":"선행사 supplier는 사물이므로 주격 which가 적절합니다.","tr":"구매 부서는 가장 낮은 가격을 제시한 공급업체를 선정했습니다.","source":"자체 제작 연습문제"},{"q":"The CEO will attend the ceremony _____ person.","a":["in","on","at","by"],"c":0,"t":"전치사·구문","e":"in person은 직접, 몸소라는 고정 표현입니다.","tr":"최고경영자는 시상식에 직접 참석할 것입니다.","source":"자체 제작 연습문제"},{"q":"The updated software is compatible _____ most mobile devices.","a":["to","with","for","at"],"c":1,"t":"빈출 구문","e":"be compatible with는 ~와 호환되다라는 표현입니다.","tr":"업데이트된 소프트웨어는 대부분의 모바일 기기와 호환됩니다.","source":"자체 제작 연습문제"},{"q":"The office manager asked that the windows _____ before the guests arrive.","a":["clean","be cleaned","are cleaned","cleaning"],"c":1,"t":"가정법·수동태","e":"요구 동사 ask 뒤 that절에는 동사원형을 쓰며 수동태이므로 be cleaned입니다.","tr":"사무실 관리자는 손님들이 도착하기 전에 창문을 청소해 달라고 요청했습니다.","source":"자체 제작 연습문제"},{"q":"The restaurant is known for its _____ service and fresh ingredients.","a":["exception","exceptional","exceptionally","exceptionality"],"c":1,"t":"품사","e":"명사 service를 수식하는 형용사 exceptional이 필요합니다.","tr":"그 식당은 뛰어난 서비스와 신선한 재료로 유명합니다.","source":"자체 제작 연습문제"},{"q":"The proposal must be approved by the director _____ it can be implemented.","a":["before","despite","because of","whereas"],"c":0,"t":"접속사","e":"뒤에 주어와 동사가 있는 절이 오며 시간상 이전을 나타내는 before가 맞습니다.","tr":"제안은 시행되기 전에 이사의 승인을 받아야 합니다.","source":"자체 제작 연습문제"},{"q":"The company is committed to _____ its environmental impact.","a":["reduce","reduced","reducing","reduction"],"c":2,"t":"전치사·동명사","e":"be committed to에서 to는 전치사이므로 동명사 reducing이 옵니다.","tr":"회사는 환경에 미치는 영향을 줄이는 데 전념하고 있습니다.","source":"자체 제작 연습문제"},{"q":"The report was _____ detailed that it required an additional review.","a":["so","such","too","very"],"c":0,"t":"결과 구문","e":"so + 형용사 + that절 구조입니다.","tr":"보고서가 매우 상세해서 추가 검토가 필요했습니다.","source":"자체 제작 연습문제"},{"q":"The company has _____ expanded its operations into three new markets.","a":["success","successful","successfully","succeed"],"c":2,"t":"품사","e":"동사 expanded를 수식하는 부사 successfully가 정답입니다.","tr":"회사는 성공적으로 사업을 세 개의 신규 시장으로 확장했습니다.","source":"자체 제작 연습문제"},{"q":"The applicants were asked to provide references _____ their previous employers.","a":["from","at","on","by"],"c":0,"t":"전치사","e":"provide references from ~은 ~로부터 추천인을 제공하다라는 의미입니다.","tr":"지원자들은 이전 고용주의 추천인을 제시하라는 요청을 받았습니다.","source":"자체 제작 연습문제"},{"q":"The meeting was rescheduled _____ a conflict in the director’s calendar.","a":["due to","although","unless","whereas"],"c":0,"t":"전치사","e":"due to 뒤에는 명사구 a conflict가 옵니다.","tr":"이사의 일정 충돌로 회의 일정이 변경되었습니다.","source":"자체 제작 연습문제"},{"q":"The product launch was more successful than the company had _____.","a":["anticipate","anticipated","anticipating","anticipation"],"c":1,"t":"시제·동사형태","e":"과거완료 had 뒤에는 과거분사 anticipated가 필요합니다.","tr":"제품 출시는 회사가 예상했던 것보다 더 성공적이었습니다.","source":"자체 제작 연습문제"},{"q":"The office supplies should be ordered _____ they run out.","a":["before","during","despite","among"],"c":0,"t":"접속사","e":"재고가 떨어지기 전에 주문해야 한다는 의미이므로 before가 맞습니다.","tr":"사무용품은 다 떨어지기 전에 주문해야 합니다.","source":"자체 제작 연습문제"},{"q":"The supervisor gave the new employee a _____ explanation of the procedures.","a":["thorough","thoroughly","thoroughness","through"],"c":0,"t":"품사","e":"명사 explanation을 수식하는 형용사 thorough가 정답입니다.","tr":"관리자는 신입 직원에게 절차에 대한 철저한 설명을 제공했습니다.","source":"자체 제작 연습문제"},{"q":"The customer asked whether the item was still _____ .","a":["availability","available","availably","avail"],"c":1,"t":"품사","e":"be동사 뒤에서 주어 item의 상태를 설명하는 형용사 available이 필요합니다.","tr":"고객은 해당 상품이 아직 구매 가능한지 물었습니다.","source":"자체 제작 연습문제"},{"q":"The board has yet to make a final decision, _____ the announcement is expected soon.","a":["but","because of","despite","unless"],"c":0,"t":"등위접속사","e":"앞뒤 두 절이 대조되므로 등위접속사 but이 적절합니다.","tr":"이사회는 아직 최종 결정을 내리지 않았지만 발표는 곧 있을 것으로 예상됩니다.","source":"자체 제작 연습문제"},{"q":"The company encourages employees _____ suggestions for improvement.","a":["submit","to submit","submitting","submitted"],"c":1,"t":"준동사","e":"encourage + 목적어 + to부정사 구조입니다.","tr":"회사는 직원들이 개선 제안을 제출하도록 장려합니다.","source":"자체 제작 연습문제"},{"q":"The delivery driver was unable to find the address, _____ caused a delay.","a":["who","what","which","whose"],"c":2,"t":"관계대명사","e":"앞 문장 전체를 선행사로 받는 계속적 용법의 which가 정답입니다.","tr":"배송 기사는 주소를 찾지 못했고, 그로 인해 지연이 발생했습니다.","source":"자체 제작 연습문제"},{"q":"The contract specifies the conditions _____ payment may be withheld.","a":["under which","which under","that under","under that"],"c":0,"t":"관계사·전치사","e":"under which는 ~한 조건하에서라는 전치사+관계대명사 구조입니다.","tr":"계약서에는 지급이 보류될 수 있는 조건이 명시되어 있습니다.","source":"자체 제작 연습문제"},{"q":"The marketing materials must be reviewed _____ publication.","a":["prior to","because","although","whereas"],"c":0,"t":"전치사·구문","e":"prior to는 ~전에라는 뜻으로 명사 publication 앞에 옵니다.","tr":"마케팅 자료는 발행 전에 검토되어야 합니다.","source":"자체 제작 연습문제"},{"q":"The firm’s profits have grown _____ over the past three years.","a":["steady","steadily","steadiness","steadied"],"c":1,"t":"품사","e":"동사 have grown을 수식하는 부사 steadily가 필요합니다.","tr":"그 회사의 수익은 지난 3년 동안 꾸준히 증가했습니다.","source":"자체 제작 연습문제"},{"q":"The manager will approve the budget once all figures _____ verified.","a":["are","is","be","being"],"c":0,"t":"수일치·수동태","e":"all figures는 복수이고 검증되는 대상이므로 are verified가 맞습니다.","tr":"모든 수치가 검증되면 관리자가 예산을 승인할 것입니다.","source":"자체 제작 연습문제"},{"q":"The new branch is expected to generate _____ revenue in its first year.","a":["substantial","substantially","substance","substantiate"],"c":0,"t":"품사","e":"명사 revenue를 수식하는 형용사 substantial이 정답입니다.","tr":"새 지점은 첫해에 상당한 수익을 창출할 것으로 예상됩니다.","source":"자체 제작 연습문제"},{"q":"The shipment was returned _____ the incorrect delivery address.","a":["because","because of","although","whereas"],"c":1,"t":"전치사·접속사","e":"뒤에 명사구 the incorrect delivery address가 오므로 because of가 맞습니다.","tr":"잘못된 배송 주소 때문에 배송품이 반송되었습니다.","source":"자체 제작 연습문제"},{"q":"The company’s policy is designed to prevent data _____ .","a":["lose","lost","loss","losing"],"c":2,"t":"품사","e":"prevent data loss에서 loss는 명사로 쓰입니다.","tr":"회사의 정책은 데이터 손실을 방지하도록 설계되었습니다.","source":"자체 제작 연습문제"},{"q":"The staff completed the project _____ the limited time available.","a":["despite","although","because","unless"],"c":0,"t":"전치사","e":"뒤에 명사구 the limited time available이 오므로 despite가 정답입니다.","tr":"직원들은 제한된 시간에도 불구하고 프로젝트를 완료했습니다.","source":"자체 제작 연습문제"},{"q":"The new printer is _____ compatible with the existing network.","a":["full","fully","fullness","fulfill"],"c":1,"t":"품사","e":"형용사 compatible을 수식하는 부사 fully가 필요합니다.","tr":"새 프린터는 기존 네트워크와 완전히 호환됩니다.","source":"자체 제작 연습문제"},{"q":"The company will provide additional training to ensure that staff are fully _____ for the new system.","a":["prepare","prepared","preparing","preparation"],"c":1,"t":"분사·형용사","e":"be prepared for는 ~에 대비되어 있다는 표현입니다.","tr":"회사는 직원들이 새 시스템에 충분히 대비하도록 추가 교육을 제공할 것입니다.","source":"자체 제작 연습문제"},{"q":"The final invoice should reflect all discounts _____ agreed upon.","a":["previous","previously","prevision","preview"],"c":1,"t":"품사","e":"과거분사 agreed를 수식하는 부사 previously가 필요합니다.","tr":"최종 청구서에는 이전에 합의된 모든 할인이 반영되어야 합니다.","source":"자체 제작 연습문제"},{"q":"The event will proceed as planned, _____ the weather conditions.","a":["regardless of","because","although","therefore"],"c":0,"t":"전치사·구문","e":"regardless of는 ~와 관계없이를 의미합니다.","tr":"날씨와 관계없이 행사는 계획대로 진행될 것입니다.","source":"자체 제작 연습문제"},{"q":"The supervisor requested that each department _____ a monthly update.","a":["provides","provide","provided","providing"],"c":1,"t":"가정법·동사형태","e":"request 뒤 that절에는 동사원형 provide를 씁니다.","tr":"관리자는 각 부서가 월간 현황을 제공하도록 요청했습니다.","source":"자체 제작 연습문제"},{"q":"The hotel offers a complimentary shuttle service _____ the airport.","a":["to","at","on","with"],"c":0,"t":"전치사","e":"shuttle service to the airport는 공항행 셔틀 서비스라는 의미입니다.","tr":"호텔은 공항행 무료 셔틀 서비스를 제공합니다.","source":"자체 제작 연습문제"},{"q":"The sales representative explained the product’s features _____ .","a":["clear","clearness","clearly","clearing"],"c":2,"t":"품사","e":"동사 explained를 수식하는 부사 clearly가 정답입니다.","tr":"영업 담당자는 제품의 기능을 명확하게 설명했습니다.","source":"자체 제작 연습문제"},{"q":"The office will accept applications _____ all required documents are included.","a":["provided that","despite","because of","during"],"c":0,"t":"접속사","e":"provided that은 ~라는 조건으로라는 의미의 접속사입니다.","tr":"필수 서류가 모두 포함된다는 조건으로 사무실은 신청서를 접수할 것입니다.","source":"자체 제작 연습문제"},{"q":"The company’s new website is easier to navigate and _____ more information.","a":["provide","provides","providing","provided"],"c":1,"t":"수일치·병렬","e":"주어 website에 동사 is와 병렬되는 현재형 동사 provides가 필요합니다.","tr":"회사의 새 웹사이트는 탐색하기 쉽고 더 많은 정보를 제공합니다.","source":"자체 제작 연습문제"},{"q":"The committee reached a decision after _____ reviewing the proposals.","a":["careful","carefully","carefulness","care"],"c":1,"t":"품사","e":"동명사 reviewing을 수식하는 부사 carefully가 필요합니다.","tr":"위원회는 제안서를 신중하게 검토한 후 결정을 내렸습니다.","source":"자체 제작 연습문제"},{"q":"The warranty does not cover damage _____ by improper use.","a":["cause","causing","caused","causes"],"c":2,"t":"분사·수동","e":"damage를 뒤에서 수식하며 원인 제공을 당한 수동 의미이므로 caused가 정답입니다.","tr":"보증은 부적절한 사용으로 발생한 손상을 보장하지 않습니다.","source":"자체 제작 연습문제"},{"q":"The company plans to hire additional staff _____ customer demand increases.","a":["should","because of","despite","during"],"c":0,"t":"가정법·도치","e":"Should + 주어 + 동사원형은 If절의 도치로, 만약 ~한다면을 뜻합니다.","tr":"고객 수요가 증가할 경우 회사는 직원을 추가 채용할 계획입니다.","source":"자체 제작 연습문제"},{"q":"The proposal was _____ accepted by the executive committee.","a":["unanimous","unanimously","unanimity","unanimityly"],"c":1,"t":"품사","e":"동사 accepted를 수식하는 부사 unanimously가 정답입니다.","tr":"그 제안은 집행위원회에서 만장일치로 받아들여졌습니다.","source":"자체 제작 연습문제"},{"q":"The store manager is looking for ways to improve customer _____.","a":["satisfy","satisfied","satisfaction","satisfactory"],"c":2,"t":"품사","e":"improve의 목적어가 필요하며 customer satisfaction은 고객 만족이라는 명사구입니다.","tr":"매장 관리자는 고객 만족도를 높일 방법을 찾고 있습니다.","source":"자체 제작 연습문제"},{"q":"All employees must complete the online course, _____ they will not be eligible for reimbursement.","a":["otherwise","therefore","moreover","similarly"],"c":0,"t":"접속부사","e":"otherwise는 그렇지 않으면이라는 의미로 조건의 결과를 나타냅니다.","tr":"모든 직원은 온라인 과정을 완료해야 하며, 그렇지 않으면 비용 상환 자격이 없습니다.","source":"자체 제작 연습문제"},{"q":"The documents are available for download _____ the company website.","a":["on","at","in","to"],"c":0,"t":"전치사","e":"웹사이트에 게시되어 있다는 의미에서는 on the website가 자연스럽습니다.","tr":"서류는 회사 웹사이트에서 내려받을 수 있습니다.","source":"자체 제작 연습문제"},{"q":"The company has introduced measures to ensure the safety of _____ employees.","a":["it","its","itself","their"],"c":1,"t":"소유격","e":"company를 받는 소유격 한정사 its가 employees 앞에 필요합니다.","tr":"회사는 직원들의 안전을 보장하기 위한 조치를 도입했습니다.","source":"자체 제작 연습문제"},{"q":"The conference registration fee includes meals and _____ materials.","a":["related","relatively","relation","relate"],"c":0,"t":"품사","e":"명사 materials를 수식하는 형용사 related가 필요합니다.","tr":"회의 등록비에는 식사와 관련 자료가 포함됩니다.","source":"자체 제작 연습문제"},{"q":"The director will be available for interviews _____ Thursday afternoon.","a":["throughout","between","among","since"],"c":0,"t":"전치사","e":"throughout Thursday afternoon은 목요일 오후 내내라는 의미입니다.","tr":"이사는 목요일 오후 내내 면접이 가능합니다.","source":"자체 제작 연습문제"},{"q":"The project was completed _____ the original budget.","a":["within","among","between","since"],"c":0,"t":"전치사","e":"within the budget은 예산 범위 내에서라는 표현입니다.","tr":"프로젝트는 원래 예산 범위 내에서 완료되었습니다.","source":"자체 제작 연습문제"},{"q":"The company has a policy _____ employees to report safety concerns immediately.","a":["requiring","require","required","requirement"],"c":0,"t":"분사·수식","e":"policy를 뒤에서 수식하는 현재분사 requiring이 적절합니다.","tr":"회사는 직원들이 안전 문제를 즉시 보고하도록 요구하는 정책을 갖고 있습니다.","source":"자체 제작 연습문제"},{"q":"The new employee quickly became _____ with the company’s filing system.","a":["familiar","familiarly","familiarity","familiarize"],"c":0,"t":"형용사·구문","e":"become familiar with는 ~에 익숙해지다라는 표현입니다.","tr":"신입 직원은 회사의 문서 정리 시스템에 빠르게 익숙해졌습니다.","source":"자체 제작 연습문제"},{"q":"The report must be submitted in _____ with the established guidelines.","a":["accord","accordance","according","accordingly"],"c":1,"t":"빈출 구문","e":"in accordance with는 ~에 따라라는 고정 표현입니다.","tr":"보고서는 정해진 지침에 따라 제출되어야 합니다.","source":"자체 제작 연습문제"},{"q":"The company will reimburse employees for expenses _____ during business travel.","a":["incur","incurred","incurring","incurrence"],"c":1,"t":"분사·수식","e":"expenses를 뒤에서 수식하는 과거분사 incurred가 필요합니다.","tr":"회사는 출장 중 발생한 비용을 직원들에게 상환할 것입니다.","source":"자체 제작 연습문제"},{"q":"The customer service line is open daily, _____ public holidays.","a":["except","excepting to","besides of","unless"],"c":0,"t":"전치사","e":"except public holidays는 공휴일을 제외하고라는 의미입니다.","tr":"고객 서비스 전화는 공휴일을 제외하고 매일 운영됩니다.","source":"자체 제작 연습문제"},{"q":"The manager asked the team to work _____ to meet the deadline.","a":["cooperative","cooperatively","cooperation","cooperate"],"c":1,"t":"품사","e":"work를 수식하는 부사 cooperatively가 필요합니다.","tr":"관리자는 마감일을 맞추기 위해 팀에 협력해서 일해 달라고 요청했습니다.","source":"자체 제작 연습문제"},{"q":"The supplier has agreed to replace any items _____ arrive damaged.","a":["who","whose","that","whom"],"c":2,"t":"관계대명사","e":"선행사 items는 사물이고 뒤에 동사 arrive가 오므로 주격 that이 적절합니다.","tr":"공급업체는 손상된 상태로 도착하는 모든 상품을 교체하기로 동의했습니다.","source":"자체 제작 연습문제"},{"q":"The company’s annual revenue increased _____ 12 percent last year.","a":["by","to","at","with"],"c":0,"t":"전치사","e":"increase by + 증가량은 ~만큼 증가하다라는 의미입니다.","tr":"회사의 연간 매출은 작년에 12퍼센트 증가했습니다.","source":"자체 제작 연습문제"},{"q":"The event coordinator will contact participants _____ the venue changes.","a":["if","despite","during","because of"],"c":0,"t":"접속사","e":"조건을 나타내는 절을 이끄는 if가 맞습니다.","tr":"장소가 변경되면 행사 담당자가 참가자들에게 연락할 것입니다.","source":"자체 제작 연습문제"},{"q":"The manager found the revised proposal _____ than the original one.","a":["persuasive","more persuasive","most persuasive","persuasively"],"c":1,"t":"비교급","e":"than이 있으므로 비교급 more persuasive가 필요합니다.","tr":"관리자는 수정된 제안서가 원본보다 더 설득력 있다고 판단했습니다.","source":"자체 제작 연습문제"},{"q":"The company is expected _____ its workforce by the end of the year.","a":["expand","to expand","expanding","expanded"],"c":1,"t":"준동사","e":"be expected to + 동사원형 구조입니다.","tr":"회사는 연말까지 인력을 확충할 것으로 예상됩니다.","source":"자체 제작 연습문제"},{"q":"The receptionist provided directions to guests _____ were attending the seminar.","a":["which","whose","who","whom"],"c":2,"t":"관계대명사","e":"사람을 선행사로 하고 뒤에 동사 were가 이어지므로 주격 who가 필요합니다.","tr":"접수 담당자는 세미나에 참석하는 손님들에게 길 안내를 제공했습니다.","source":"자체 제작 연습문제"},{"q":"The manager approved the purchase _____ reviewing the supplier’s quotation.","a":["after","during","despite","because of"],"c":0,"t":"접속사·전치사","e":"after는 동명사 reviewing을 목적어로 취할 수 있습니다.","tr":"관리자는 공급업체의 견적서를 검토한 후 구매를 승인했습니다.","source":"자체 제작 연습문제"},{"q":"The company’s new policy is intended to make the hiring process more _____.","a":["efficient","efficiently","efficiency","efficiencies"],"c":0,"t":"품사","e":"make + 목적어 + 형용사 보어 구조로 process의 상태를 설명합니다.","tr":"회사의 새 정책은 채용 절차를 더 효율적으로 만들기 위한 것입니다.","source":"자체 제작 연습문제"},{"q":"The report includes a list of tasks _____ must be completed before launch.","a":["who","what","that","whose"],"c":2,"t":"관계대명사","e":"선행사 tasks는 사물이고 뒤에 동사 must be completed가 오므로 that이 정답입니다.","tr":"보고서에는 출시 전에 완료해야 하는 작업 목록이 포함되어 있습니다.","source":"자체 제작 연습문제"},{"q":"The company will continue the program _____ it proves to be effective.","a":["as long as","despite","because of","during"],"c":0,"t":"접속사","e":"as long as는 ~하는 한이라는 조건을 나타냅니다.","tr":"프로그램이 효과가 있는 것으로 입증되는 한 회사는 el.innerHTML=`<div class="row"><h2 class="section-title">단어 학습</h2><span class="tag">${deckIndex+1} / ${deck.length}</span></div><div class="progress"><i style="width:${(deckIndex+1)/deck.length*100}%"></i></div><div class="card" style="margin-top:12px"><div class="row"><span class="tag">${w.lv} · ${w.topic}</span><span class="tag">우선순위 ${w.priority||"A"}</span><button class="btn" onclick="speak('${w.w}')">🔊 발음</button></div><div class="word">${deckMode==="ko"?w.m:w.w}</div><div class="muted small">${deckMode==="ko"?"한국어 뜻":"발음기호 "+(w.ipa||"음성 재생")+" · "+w.p}</div>${deckMode==="typing"?`<input id="typed" class="answer-input" style="margin-top:16px" placeholder="영단어를 입력하세요"><button class="btn primary full" style="margin-top:8px" onclick="checkTyped()">정답 확인</button>`:opts.map((x,i)=>`<button class="choice" onclick="answerWord('${x.w}')">${i+1}. ${deckMode==="ko"?x.w:x.m}</button>`).join("")}${deckResult!==null?`<div class="feedback ${deckResult?"ok":"no"}"><b>${deckResult?"✓ 정답":"✕ 오답"}</b><br>${w.w} — ${w.m}<br>${w.phrase}<br>${w.ex}<br>${w.tr}</div>`:""}<div class="grid" style="margin-top:12px"><button class="btn" onclick="toggleSave('${w.w}')">${saved?"★ 보관됨":"☆ 보관하기"}</button>${deckResult!==null?`<button class="btn primary" onclick="nextWord()">다음 단어 →</button>`:""}</div></div>`}
function record(ok){state.attempts++;if(ok)state.correct++;state.history.push({date:new Date().toISOString().slice(0,10),ok});persist()}
function answerWord(v){if(deckResult!==null)return;let w=deck[deckIndex],ok=v===w.w;deckResult=ok;record(ok);let s=state.wordStats[w.w]||{stage:0,correct:0,wrong:0};if(ok){s.correct++;s.stage=Math.min(3,s.stage+1);if(state.wrongWords[w.w]){state.wrongWords[w.w].streak=(state.wrongWords[w.w].streak||0)+1;if(state.wrongWords[w.w].streak>=3)delete state.wrongWords[w.w]}}else{s.wrong++;s.stage=Math.max(0,s.stage-1);let z=state.wrongWords[w.w]||{count:0,streak:0};z.count++;z.streak=0;state.wrongWords[w.w]=z}state.wordStats[w.w]=s;persist();wordScreen()}
function checkTyped(){let w=deck[deckIndex];answerWord($("typed").value.trim().toLowerCase())}
function nextWord(){deckIndex++;deckResult=null;wordScreen()}
function toggleSave(w){if(state.saved.includes(w))state.saved=state.saved.filter(x=>x!==w);else state.saved.push(w);persist();wordScreen();toast("보관함을 업데이트했습니다.")}
function speak(w){if(!("speechSynthesis"in window)){toast("이 기기에서 음성 재생을 지원하지 않습니다.");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(w);u.lang="en-US";u.rate=.86;speechSynthesis.speak(u)}
function startPart(list=PART){partDeck=[...list].sort(()=>Math.random()-.5);partIndex=0;partResult=null;show("part5")}
function partScreen(){let el=$("part5");if(!partDeck.length){el.innerHTML=`<h2 class="section-title">Part 5 Training</h2><div class="card"><div class="score">Part 5</div><p class="muted small">문법 및 어휘 문장 완성 연습 · 자체 제작 문제 ${PART.length}개</p><button class="btn primary full" onclick="startPart()">문제 풀이 시작</button></div>`;return}if(partIndex>=partDeck.length){el.innerHTML=`<div class="card" style="text-align:center;padding:35px 18px"><h2>Part 5 학습 완료</h2><div class="score">${partDeck.filter(x=>x.ok).length}/${partDeck.length}</div><button class="btn primary full" onclick="partDeck=[];partScreen()">메뉴로 돌아가기</button></div>`;return}let q=partDeck[partIndex];el.innerHTML=`<div class="row"><h2 class="section-title">Part 5</h2><span class="tag">${partIndex+1} / ${partDeck.length}</span></div><div class="progress"><i style="width:${(partIndex+1)/partDeck.length*100}%"></i></div><div class="card" style="margin-top:12px"><span class="tag">${q.t}</span><p style="font-size:18px;font-weight:750;line-height:1.7;margin:22px 0">${q.q.replace("_____","<u>_______</u>")}</p>${q.a.map((a,i)=>`<button class="choice ${partResult!==null&&i===q.c?"correct":""} ${partResult===i&&i!==q.c?"wrong":""}" ${partResult!==null?"disabled":""} onclick="answerPart(${i})">${i+1}. ${a}</button>`).join("")}${partResult!==null?`<div class="feedback ${partResult===q.c?"ok":"no"}"><b>${partResult===q.c?"✓ 정답":"✕ 오답"}</b><br>정답: ${q.a[q.c]}<br>${q.tr}<br><b>해설</b> ${q.e}</div><button class="btn primary full" style="margin-top:12px" onclick="nextPart()">다음 문제 →</button>`:""}</div>`}
function answerPart(i){if(partResult!==null)return;let q=partDeck[partIndex];partResult=i;q.ok=i===q.c;record(q.ok);if(!q.ok){let k=PART.indexOf(q),z=state.wrongPart[k]||{count:0};z.count++;state.wrongPart[k]=z}persist();partScreen()}
function nextPart(){partIndex++;partResult=null;partScreen()}
function reviewScreen(){let el=$("review"),ww=Object.entries(state.wrongWords),wp=Object.entries(state.wrongPart),sv=state.saved;el.innerHTML=`<h2 class="section-title">오답 및 개인 보관함</h2><div class="grid"><div class="metric"><span class="small muted">단어 오답</span><strong>${ww.length}</strong></div><div class="metric"><span class="small muted">Part 5 오답</span><strong>${wp.length}</strong></div></div><div class="card" style="margin-top:12px"><div class="row"><b>단어 오답</b><button class="btn soft" onclick="reviewWords()">다시 풀기</button></div>${ww.length?ww.map(([k,v])=>`<div class="listitem row"><div><b>${k}</b><div class="small muted">${WORDS.find(x=>x.w===k)?.m||""} · 오답 ${v.count}회</div></div></div>`).join(""):'<p class="small muted">단어 오답이 없습니다.</p>'}</div><div class="card"><div class="row"><b>Part 5 오답</b><button class="btn soft" onclick="reviewPart()">다시 풀기</button></div>${wp.length?wp.map(([k,v])=>`<div class="listitem"><div class="small">${PART[+k]?.q||""}</div><div class="small muted">오답 ${v.count}회</div></div>`).join(""):'<p class="small muted">Part 5 오답이 없습니다.</p>'}</div><div class="card"><div class="row"><b>내 단어 보관함</b><span class="tag">${sv.length}개</span></div>${sv.length?sv.map(k=>`<div class="listitem row"><div><b>${k}</b><div class="small muted">${WORDS.find(x=>x.w===k)?.m||""}</div></div><button class="btn" onclick="removeSaved('${k}')">삭제</button></div>`).join(""):'<p class="small muted">보관한 단어가 없습니다.</p>'}<button class="btn primary full" style="margin-top:12px" onclick="savedStudy()">보관 단어 학습</button></div>`}
function reviewWords(){let list=Object.keys(state.wrongWords).map(k=>WORDS.find(x=>x.w===k)).filter(Boolean);if(!list.length){toast("복습할 단어가 없습니다.");return}startWords("en",list)}
function reviewPart(){let list=Object.keys(state.wrongPart).map(k=>PART[+k]).filter(Boolean);if(!list.length){toast("복습할 문제가 없습니다.");return}startPart(list)}
function savedStudy(){let list=state.saved.map(k=>WORDS.find(x=>x.w===k)).filter(Boolean);if(!list.length){toast("보관한 단어가 없습니다.");return}startWords("en",list)}
function removeSaved(w){state.saved=state.saved.filter(x=>x!==w);persist();reviewScreen()}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="toeic-master-backup.json";a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);state={...DEFAULT,...x};persist();toast("백업을 불러왔습니다.");show("home")}catch(err){toast("백업 파일을 읽지 못했습니다.")}};r.readAsText(f)}
function resetData(){if(confirm("학습 기록과 보관함을 모두 초기화할까요?")){state={...DEFAULT};persist();show("home")}}
function render(){if(screen==="home")home();if(screen==="settings")settings();if(screen==="words")wordScreen();if(screen==="part5")partScreen();if(screen==="review")reviewScreen()}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>show(b.dataset.screen)));
if("serviceWorker"in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
render();
</script>
</body></html>
