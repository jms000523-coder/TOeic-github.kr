ated at a hotel near the convention site.","tr":"□ 그 발표자는 협의회 장소 근처의 호텔에 숙박할 것이다.","lv":"중급","topic":"여행·교통","source":"토익 단어장 PDF 85p; 9월 20일 100단어.txt","sourceRefs":[{"file":"9월 20일 100단어.txt","page":6,"row":43}]},{"w":"implement","p":"동사","m":"동. 실행하다; 명. 도구, 장치","ipa":"/ˈɪmplɪment/","phrase":"implement a policy","ex":"The new policy will be implemented next month.","tr":"새 정책은 다음 달에 시행될 것이다.","lv":"중급","topic":"회사·조직","source":"토익 단어장 PDF 85p"},{"w":"negotiate","p":"동사","m":"v. 협상하다","ipa":"/nɪˈɡoʊʃieɪt/","phrase":"negotiate a contract","ex":"071 We will try our best to negotiate a fair price for the goods.","tr":"negotiate ★ 우리는 그 상품의 적정한 가격을 협상하기 위해 최선을 다할 것이다.","lv":"중급","topic":"계약·협상","source":"토익 단어장 PDF 85p; 9월 6일 100단어.txt","sourceRefs":[{"file":"9월 6일 100단어.txt","page":9,"row":71}]},{"w":"provisional","p":"형용사","m":"임시의, 잠정적인","ipa":"/prəˈvɪʒənəl/","phrase":"provisional schedule","ex":"A provisional schedule has been distributed.","tr":"잠정 일정표가 배포되었다.","lv":"고급","topic":"일정·행사"},{"w":"reimburse","p":"동사","m":"동. 환급하다, 변제하다","ipa":"/ˌriːɪmˈbɜːrs/","phrase":"reimburse expenses","ex":"The company will reimburse travel expenses.","tr":"회사는 출장 경비를 환급할 것이다.","lv":"고급","topic":"재무·회계","source":"토익 단어장 PDF 85p"},{"w":"efficiently","p":"부사","m":"부. 효율적으로 능률적으로; 부. 효과적으로","ipa":"/ɪˈfɪʃəntli/","phrase":"operate efficiently","ex":"The new system allows staff to work efficiently.","tr":"새 시스템은 직원들이 효율적으로 일하게 해 준다.","lv":"기초","topic":"사무·행정","source":"토익 단어장 PDF 85p"},{"w":"vacancy","p":"명사","m":"공석, 빈자리","ipa":"/ˈveɪkənsi/","phrase":"job vacancy","ex":"The company announced a vacancy in its marketing department.","tr":"회사는 마케팅 부서의 공석을 발표했다.","lv":"중급","topic":"인사·채용"},{"w":"inventory","p":"명사","m":"명. 재고, 재고 목록; 명. 재고 조사","ipa":"/ˈɪnvəntɔːri/","phrase":"inventory control","ex":"The store conducts inventory checks every month.","tr":"그 매장은 매달 재고 조사를 실시한다.","lv":"중급","topic":"구매·판매","source":"토익 단어장 PDF 85p"},{"w":"reliable","p":"형용사","m":"adj. 신뢰할 수 있는","ipa":"/rɪˈlaɪ const PHRASES=[["be responsible for","~을 담당하다","She is responsible for preparing the report."],["comply with","~을 준수하다","All staff must comply with the policy."],["in accordance with","~에 따라","The work was completed in accordance with the contract."],["be eligible for","~할 자격이 있다","Employees are eligible for paid leave."],["be subject to","~의 대상이 되다","All orders are subject to approval."],["prior to","~ 전에","Please register prior to the event."],["in response to","~에 대한 응답으로","The company acted in response to customer feedback."],["take advantage of","~을 활용하다","Customers can take advantage of the discount."]];

const DATABASE_META={version:"2026.11.28",period:"제공 PDF 통합",wordCount:WORDS.length,part5Count:PART.length,frequencyLabel:"PDF 수록 어휘 및 자체 제작 문항",method:"제공 PDF에서 확인 가능한 항목을 통합. 전체 시험의 출제 빈도 통계가 아님."};
const DEFAULT={goal:800,current:600,date:"",minutes:60,daily:0,level:"중급",saved:[],wrongWords:{},wrongPart:{},wordStats:{},attempts:0,correct:0,history:[],partSession:null,pausedPartSession:null,partHistory:[],recentPartIds:[]};
let state;try{state={...DEFAULT,...JSON.parse(localStorage.getItem("tm-data")||"{}")}}catch(e){state={...DEFAULT}}
Object.keys(state.wrongPart||{}).forEach(k=>{if(/^\d+$/.test(k)){let q=PART[+k];if(q){state.wrongPart[q.id]=state.wrongPart[k];delete state.wrongPart[k]}}});
let screen="home",deck=[],deckIndex=0,deckMode="en",deckResult=null,partDeck=[],partIndex=0,partResult=null,phraseMode=false,partMenu=false;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function persist(){localStorage.setItem("tm-data",JSON.stringify(state))}
function toast(s){let t=$("toast");t.textContent=s;t.style.display="block";setTimeout(()=>t.style.display="none",1800)}
function daysLeft(){return state.date?Math.max(0,Math.ceil((new Date(state.date+"T23:59:59")-new Date())/86400000)):null}
function plan(){let d=daysLeft()||30,gap=Math.max(0,state.goal-state.current),factor=Math.min(1.35,Math.max(.55,state.minutes/60)),total=Math.round(Math.min(1800,Math.max(60,80+gap*2.2))*factor),per=Math.ceil(total/d);if(state.daily>0)per=Math.min(per,state.daily);return{d,total,per,review:Math.min(60,Math.max(10,Math.round(per*.7))),part:Math.max(10,Math.min(45,Math.round(10+gap*.075))),phrases:Math.max(3,Math.round(per*.15))}}
function learned(){return WORDS.filter(w=>(state.wordStats[w.w]?.stage||0)>=3).length}
function pct(){return state.attempts?Math.round(state.correct/state.attempts*100):0}
function show(name){screen=name;document.querySelectorAll(".screen").forEach(x=>x.classList.toggle("active",x.id===name));document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x.dataset.screen===name));render()}
function home(){let p=plan(),d=daysLeft();$("home").innerHTML=`<div class="hero"><div class="eyebrow">MY TOEIC GOAL</div><div class="score">${state.goal}<span style="font-size:15px">점 목표</span></div><div class="row small"><span>현재 예상 ${state.current}점</span><span>${d===null?"시험일 미설정":`시험까지 ${d}일`}</span></div><div class="progress"><i style="width:${Math.min(100,state.current/state.goal*100)}%"></i></div><p class="small muted">점수는 학습 계획을 위한 참고값이며 실제 시험 점수를 보장하지 않습니다.</p></div><div class="row" style="margin:17px 0 10px"><b>오늘의 학습 계획</b><button class="btn soft" onclick="show('settings')">계획 수정</button></div><div class="grid"><div class="metric"><span class="small muted">신규 단어</span><strong>${p.per}개</strong><span class="small muted">하루 권장량</span></div><div class="metric"><span class="small muted">복습 단어</span><strong>${p.review}개</strong><span class="small muted">하루 권장량</span></div><div class="metric"><span class="small muted">Part 5</span><strong>${p.part}문제</strong><span class="small muted">하루 권장량</span></div><div class="metric"><span class="small muted">빈출 구문</span><strong>${p.phrases}개</strong><span class="small muted">하루 권장량</span></div></div><div class="card" style="margin-top:12px"><div class="row"><b>단어 학습 현황</b><b>${learned()} / ${WORDS.length}</b></div><div class="progress"><i style="width:${learned()/WORDS.length*100}%"></i></div><p class="small muted">반복 복습을 통해 암기 단계가 올라갑니다.</p><div class="grid"><button class="btn primary" onclick="startWords('en')">단어 학습 시작</button><button class="btn" onclick="startPart()">Part 5 시작</button></div></div><div class="grid"><div class="metric"><span class="small muted">누적 풀이</span><strong>${state.attempts}</strong></div><div class="metric"><span class="small muted">정답률</span><strong>${pct()}%</strong></div></div>`}
function settings(){let s=$("settings");s.innerHTML=`<h2 class="section-title">나의 학습 계획</h2><div class="card"><div class="field"><label>목표 TOEIC 점수</label><select id="goal">${[500,550,600,650,700,750,800,850,900,950,990].map(x=>`<option ${state.goal==x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>현재 예상 점수</label><input id="current" type="number" min="10" max="990" value="${state.current}"></div><div class="field"><label>시험 예정일</label><input id="date" type="date" value="${state.date}"></div><div class="field"><label>하루 학습 가능 시간 (분)</label><input id="minutes" type="number" min="10" max="600" value="${state.minutes}"></div><div class="field"><label>희망 신규 단어 수 (0이면 자동)</label><input id="daily" type="number" min="0" max="100" value="${state.daily}"></div><div class="field"><label>현재 어휘 수준</label><select id="level">${["기초","중급","고급"].map(x=>`<option ${state.level===x?"selected":""}>${x}</option>`).join("")}</select></div><button class="btn primary full" onclick="saveSettings()">학습 계획 저장</button></div><div class="card"><b>콘텐츠 및 데이터 안내</b><p class="small muted">사용자가 제공한 PDF 7종의 어휘를 통합했습니다. 2,109개 번호 항목이 있는 단어 PDF와 6개 시험일자별 100단어 PDF를 통합했습니다. 줄바꿈으로 분리된 일부 항목도 보완하고, 대소문자·공백·하이픈 차이를 정규화해 중복을 제거했습니다. PDF의 수록 여부는 실제 시험 출현 횟수와 다르며, 공식 4개년 전수 출제 빈도 통계로 표시하지 않습니다. 일부 단어는 PDF에 예문이 없어 뜻 중심으로 학습합니다. 업로드 자료는 개인 학습용으로만 사용하고 재배포하지 마세요. 학습 기록은 이 기기의 브라우저 저장 공간에 저장됩니다.</p><p class="small muted">DB 버전 ${DATABASE_META.version} · 단어 ${WORDS.length}개 · Part 5 ${PART.length}문제</p><button class="btn full" onclick="exportData()">학습 데이터 백업 내보내기</button><label class="btn full" style="display:block;text-align:center;margin-top:8px">백업 파일 불러오기<input type="file" accept="application/json" onchange="importData(event)" hidden></label><button class="btn full" style="margin-top:8px;color:#b42332" onclick="resetData()">모든 학습 기록 초기화</button></div>`}
function saveSettings(){let goal=+$("goal").value,current=+$("current").value;if(goal<10||goal>990||current<10||current>990){toast("점수를 10~990 사이로 입력하세요.");return}state.goal=goal;state.current=current;state.date=$("date").value;state.minutes=Math.max(10,+$("minutes").value||60);state.daily=Math.max(0,+$("daily").value||0);state.level=$("level").value;persist();toast("학습 계획을 저장했습니다.");show("home")}
function startWords(mode,list=WORDS){let pool=list;if(list===WORDS){const rank={"기초":1,"중급":2,"고급":3};const maxRank=Math.max(2,Math.min(3,(rank[state.level]||2)+(state.goal>=850?1:0)));pool=WORDS.filter(x=>(rank[x.lv]||2)<=maxRank)}deck=[...pool].sort(()=>Math.random()-.5).slice(0,Math.min(10,pool.length));deckIndex=0;deckMode=mode;deckResult=null;phraseMode=false;show("words")}

function baseWordScreen(){let el=$("words");if(phraseMode){let x=PHRASES[deckIndex];el.innerHTML=`<div class="row"><h2 class="section-title">빈출 구문</h2><span class="tag">${deckIndex+1}/${PHRASES.length}</span></div><div class="card"><div class="word" style="font-size:25px">${x[0]}</div><p>${x[1]}</p><p class="small muted">${x[2]}</p><div class="row"><button class="btn" onclick="deckIndex=Math.max(0,deckIndex-1);wordScreen()">이전</button><button class="btn primary" onclick="if(deckIndex<PHRASES.length-1){deckIndex++;wordScreen()}else{phraseMode=false;wordScreen()}">다음</button></div></div>`;return}
if(!deck.length){el.innerHTML=`<h2 class="section-title">단어장 학습</h2><div class="card"><p class="muted small">학습 유형을 선택하세요.</p><button class="btn full" onclick="startWords('en')">영단어 → 뜻 선택</button><button class="btn full" style="margin-top:8px" onclick="startWords('ko')">뜻 → 영단어 선택</button><button class="btn full" style="margin-top:8px" onclick="startWords('typing')">뜻 보고 직접 입력</button><button class="btn full" style="margin-top:8px" onclick="startPhrases()">빈출 구문 학습</button><p class="small muted">등록 단어 ${WORDS.length}개 · Part 5 ${PART.length}문제 · 내 보관 단어 ${state.saved.length}개</p></div>`;return}
if(deckIndex>=deck.length){el.innerHTML=`<div class="card" style="text-align:center;padding:35px 18px"><h2>학습 완료!</h2><div class="score">${deck.length}개</div><p class="muted">이번 학습을 마쳤습니다.</p><button class="btn primary full" onclick="deck=[];wordScreen()">단어 메뉴로</button></div>`;return}
let w=deck[deckIndex],saved=state.saved.includes(w.w),opts=[...WORDS.filter(x=>x.w!==w.w).sort(()=>Math.random()-.5).slice(0,3),w].sort(()=>Math.random()-.5);
el.innerHTML=`<div class="row"><h2 class="section-title">단어 학습</h2><span class="tag">${deckIndex+1} / ${deck.length}</span></div><div class="progress"><i style="width:${(deckIndex+1)/deck.length*100}%"></i></div><div class="card" style="margin-top:12px"><div class="row"><span class="tag">${w.lv} · ${w.topic}</span><span class="tag">우선순위 ${w.priority||"A"}</span><button class="btn" onclick="speak('${w.w}')">🔊 발음</button></div><div class="word">${deckMode==="ko"?w.m:w.w}</div><div class="muted small">${deckMode==="ko"?"한국어 뜻":"발음기호 "+(w.ipa||"음성 재생")+" · "+w.p}</div>${deckMode==="typing"?`<input id="typed" class="answer-input" style="margin-top:16px" placeholder="영단어를 입력하세요"><button class="btn primary full" style="margin-top:8px" onclick="checkTyped()">정답 확인</button>`:opts.map((x,i)=>`<button class="choice" onclick="answerWord('${x.w}')">${i+1}. ${deckMode==="ko"?x.w:x.m}</button>`).join("")}${deckResult!==null?`<div class="feedback ${deckResult?"ok":"no"}"><b>${deckResult?"✓ 정답":"✕ 오답"}</b><br>${w.w} — ${w.m}<br>${w.phrase}<br>${w.ex}<br>${w.tr}</div>`:""}<div class="grid" style="margin-top:12px"><button class="btn" onclick="toggleSave('${w.w}')">${saved?"★ 보관됨":"☆ 보관하기"}</button>${deckResult!==null?`<button class="btn primary" onclick="nextWord()">다음 단어 →</button>`:""}</div></div>`}
function record(ok){state.attempts++;if(ok)state.correct++;state.history.push({date:new Date().toISOString().slice(0,10),ok});persist()}
function answerWord(v){if(deckResult!==null)return;let w=deck[deckIndex],ok=v===w.w;deckResult=ok;record(ok);let s=state.wordStats[w.w]||{stage:0,correct:0,wrong:0};if(ok){s.correct++;s.stage=Math.min(3,s.stage+1);if(state.wrongWords[w.w]){state.wrongWords[w.w].streak=(state.wrongWords[w.w].streak||0)+1;if(state.wrongWords[w.w].streak>=3)delete state.wrongWords[w.w]}}else{s.wrong++;s.stage=Math.max(0,s.stage-1);let z=state.wrongWords[w.w]||{count:0,streak:0};z.count++;z.streak=0;state.wrongWords[w.w]=z}state.wordStats[w.w]=s;persist();wordScreen()}
function checkTyped(){let w=deck[deckIndex];answerWord($("typed").value.trim().toLowerCase())}
function nextWord(){deckIndex++;deckResult=null;wordScreen()}
function toggleSave(w){if(state.saved.includes(w))state.saved=state.saved.filter(x=>x!==w);else state.saved.push(w);persist();wordScreen();toast("보관함을 업데이트했습니다.")}
function speak(w){if(!("speechSynthesis"in window)){toast("이 기기에서 음성 재생을 지원하지 않습니다.");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(w);u.lang="en-US";u.rate=.86;speechSynthesis.speak(u)}
function baseStartPart(mode="mixed",type=""){let recent=new Set(state.recentPartIds||[]),pool=PART.filter(q=>!recent.has(q.id));if(mode==="type"){pool=pool.filter(q=>q.t===type);if(pool.length<10)pool=PART.filter(q=>q.t===type)}if(mode==="review")pool=Object.keys(state.wrongPart).map(id=>PART.find(q=>q.id===id)).filter(Boolean);if(mode==="mixed"&&pool.length<10){state.recentPartIds=[];pool=PART.slice()}if(mode==="review"&&pool.length===0){toast("복습할 오답 문제가 없습니다.");return}if(mode==="type"&&pool.length<10){toast("선택한 유형의 문제가 10개 미만입니다.");return}let selected=[];if(mode==="mixed"){[["기초",3],["중급",4],["고급",3]].forEach(([lv,n])=>selected.push(...pool.filter(q=>q.level===lv).sort(()=>Math.random()-.5).slice(0,n)));}if(selected.length<10)selected.push(...pool.filter(q=>!selected.includes(q)).sort(()=>Math.random()-.5).slice(0,Math.min(10-selected.length,pool.length-selected.length)));selected=selected.slice(0,10).sort(()=>Math.random()-.5);if(selected.length<10&&mode!=="review"){toast("문제가 10개 미만입니다.");return}state.partSession={mode,type,deck:selected.map(q=>q.id),index:0,answers:{},done:false};state.recentPartIds=[...(state.recentPartIds||[]),...selected.map(q=>q.id)].slice(-120);partMenu=false;persist();partScreen()}
function resumePart(){partMenu=false;show("part5")}
function resumePausedPart(){state.partSession=state.pausedPartSession;state.pausedPartSession=null;partMenu=false;persist();show("part5")}
function openPartMenu(){partMenu=true;partScreen()}
function basePartScreen(){let el=$("part5"),s=state.partSession;if(partMenu){el.innerHTML=`<h2 class="section-title">Part 5 학습 메뉴</h2><div class="card"><p class="small muted">중단한 학습은 기기에 저장되어 있습니다.</p>${s?`<button class="btn primary full" onclick="resumePart()">현재 테스트 이어서 풀기 (${s.index+1}/${s.deck.length})</button>`:""}${state.pausedPartSession?`<button class="btn full" style="margin-top:8px" onclick="resumePausedPart()">이전에 중단한 테스트 이어서 풀기</button>`:""}<button class="btn full" style="margin-top:8px" onclick="if(state.partSession){state.pausedPartSession=state.partSession;state.partSession=null;persist()}startPart('mixed')">새로운 난이도 혼합 테스트</button><div class="field" style="margin-top:14px"><label>유형별 집중 학습</label><select id="p5type">${[...new Set(PART.map(q=>q.t))].map(t=>`<option>${t}</option>`).join("")}</select><button class="btn full" style="margin-top:8px" onclick="if(state.partSession){state.pausedPartSession=state.partSession;state.partSession=null;persist()}startPart('type',document.getElementById('p5type').value)">선택 유형 10문제 풀기</button></div><button class="btn full" style="margin-top:8px" onclick="partMenu=false;show('home')">홈으로</button></div>`;return}if(!s){el.innerHTML=`<h2 class="section-title">Part 5 Training</h2><div class="card"><div class="score">Part 5</div><p class="muted small">10문제 단위 학습 · 문제은행 ${PART.length}문항</p><button class="btn primary full" onclick="startPart('mixed')">난이도 혼합 테스트 시작</button><div class="field" style="margin-top:14px"><label>유형별 집중 학습</label><select id="p5type">${[...new Set(PART.map(q=>q.t))].map(t=>`<option>${t}</option>`).join("")}</select><button class="btn full" style="margin-top:8px" onclick="startPart('type',document.getElementById('p5type').value)">선택 유형 10문제 풀기</button></div>${state.partSession?`<button class="btn full" onclick="resumePart()">이어서 풀기</button>`:""}</div>${state.partHistory?.length?`<div class="card"><b>완료한 테스트</b>${state.partHistory.slice(-8).reverse().map(h=>`<div class="listitem"><div class="row"><b>${h.mode==="mixed"?"난이도 혼합":h.type||"오답 복습"}</b><span class="tag">${h.score}/${h.total||10} · ${h.rate}%</span></div><div class="small muted">${h.date}</div></div>`).join("")}</div>`:""}`;return}let deck=s.deck.map(id=>PART.find(q=>q.id===id)).filter(Boolean);if(s.done){let score=s.deck.filter(id=>s.answers[id]?.ok).length,total=s.deck.length,rate=Math.round(score/total*100);el.innerHTML=`<h2 class="section-title">테스트 결과</h2><div class="card"><div class="score">${score}/${total}</div><p>정답 ${score}개 · 오답 ${total-score}개 · 정답률 ${rate}%</p></div>${deck.map((q,i)=>{let a=s.answers[q.id];return `<div class="card"><b>${i+1}. ${q.t} · ${a.ok?'정답':'오답'}</b><p>${q.q}</p><p class="small">내 답: ${q.a[a.choice]} / 정답: ${q.a[q.c]}</p><p class="small">${q.e}</p></div>`}).join("")}<button class="btn primary full" onclick="state.partHistory.push({mode:s.mode,type:s.type,score:${score},rate:${rate},date:new Date().toLocaleString('ko-KR')});state.partSession=null;persist();partScreen()">완료</button>`;return}let q=deck[s.index],a=s.answers[q.id];el.innerHTML=`<div class="row"><h2 class="section-title">Part 5</h2><span class="tag">${s.index+1} / ${s.deck.length}</span></div><div class="progress"><i style="width:${(s.index+1)/s.deck.length*100}%"></i></div><div class="small muted">${s.mode==='mixed'?'난이도 혼합':s.type} · ${q.level}</div><div class="card"><span class="tag">${q.t}</span><p style="font-size:18px;font-weight:750;line-height:1.7;margin:22px 0">${q.q}</p>${q.a.map((v,i)=>`<button class="choice ${a&&i===q.c?'correct':''} ${a&&i===a.choice&&i!==q.c?'wrong':''}" ${a?'disabled':''} onclick="answerPart(${i})">${i+1}. ${v}</button>`).join('')}${a?`<div class="feedback ${a.ok?'ok':'no'}"><b>${a.ok?'✓ 정답':'✕ 오답'}</b><br>정답: ${q.a[q.c]}<br>${q.tr}<br><b>해설</b> ${q.e}<div class="small" style="margin-top:8px"><b>선택지 해설</b>${(q.wrongExp||[]).map((v,i)=>`<div>${i+1}. ${v}</div>`).join("")}</div></div><button class="btn primary full" onclick="nextPart()">${s.index===s.deck.length-1?'결과 확인':'다음 문제 →'}</button>`:''}</div><button class="btn full" onclick="openPartMenu()">학습 메뉴</button>`}

function answerPart(i){let s=state.partSession;if(!s||s.done)return;let q=PART.find(x=>x.id===s.deck[s.index]);if(s.answers[q.id])return;let ok=i===q.c;s.answers[q.id]={choice:i,ok};record(ok);if(!ok){let z=state.wrongPart[q.id]||{count:0};z.count++;state.wrongPart[q.id]=z}persist();partScreen()}
function nextPart(){let s=state.partSession;if(s.index<s.deck.length-1){s.index++;persist();partScreen()}else{s.done=true;persist();partScreen()}}
function baseReviewScreen(){let el=$("review"),ww=Object.entries(state.wrongWords),wp=Object.entries(state.wrongPart),sv=state.saved;el.innerHTML=`<h2 class="section-title">오답 및 개인 보관함</h2><div class="grid"><div class="metric"><span class="small muted">단어 오답</span><strong>${ww.length}</strong></div><div class="metric"><span class="small muted">Part 5 오답</span><strong>${wp.length}</strong></div></div><div class="card" style="margin-top:12px"><div class="row"><b>단어 오답</b><button class="btn soft" onclick="reviewWords()">다시 풀기</button></div>${ww.length?ww.map(([k,v])=>`<div class="listitem row"><div><b>${k}</b><div class="small muted">${WORDS.find(x=>x.w===k)?.m||""} · 오답 ${v.count}회</div></div></div>`).join(""):'<p class="small muted">단어 오답이 없습니다.</p>'}</div><div class="card"><div class="row"><b>Part 5 오답</b><button class="btn soft" onclick="reviewPart()">다시 풀기</button></div>${wp.length?wp.map(([k,v])=>`<div class="listitem"><div class="small">${PART.find(x=>x.id===k)?.q||""}</div><div class="small muted">오답 ${v.count}회</div></div>`).join(""):'<p class="small muted">Part 5 오답이 없습니다.</p>'}</div><div class="card"><div class="row"><b>내 단어 보관함</b><span class="tag">${sv.length}개</span></div>${sv.length?sv.map(k=>`<div class="listitem row"><div><b>${k}</b><div class="small muted">${WORDS.find(x=>x.w===k)?.m||""}</div></div><button class="btn" onclick="removeSaved('${k}')">삭제</button></div>`).join(""):'<p class="small muted">보관한 단어가 없습니다.</p>'}<button class="btn primary full" style="margin-top:12px" onclick="savedStudy()">보관 단어 학습</button></div>`}
function reviewWords(){let list=Object.keys(state.wrongWords).map(k=>WORDS.find(x=>x.w===k)).filter(Boolean);if(!list.length){toast("복습할 단어가 없습니다.");return}startWords("en",list)}

function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="toeic-master-backup.json";a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);state={...DEFAULT,...x};persist();toast("백업을 불러왔습니다.");show("home")}catch(err){toast("백업 파일을 읽지 못했습니다.")}};r.readAsText(f)}

function partScreen(){if(partView==='study'){studyScreen();return}if(partView==='test'){_basePartScreen();return}const el=$('part5'),s=state.partSession;el.innerHTML=`<h2 class="section-title">Part 5 학습</h2><div class="card"><div class="score">PART 5</div><p class="small muted">문법을 정리한 뒤 Test로 실전 연습을 진행하세요.</p><div class="grid"><button class="btn primary" onclick="setPartView('test')">Test</button><button class="btn soft" onclick="setPartView('study')">Study</button></div></div>${s&&!s.done?`<div class="card"><b>진행 중인 테스트</b><p class="small muted">${s.mode==='mixed'?'난이도 혼합':s.type||'유형별'} · ${s.index+1}/${s.deck.length}번</p><button class="btn primary full" onclick="setPartView('test');resumePart()">이어서 풀기</button></div>`:''}<div class="card"><b>학습 기록</b><p class="small muted">문제은행 ${PART.length}문항 · ${[...new Set(PART.map(q=>q.t))].length}개 유형</p><button class="btn full" onclick="setPartView('test')">문법 테스트 페이지로 이동</button></div>`}

const STUDY=[
{title:'01. 명사와 대명사',sub:'명사 자리 · 가산/불가산 · 인칭·재귀·지시·부정대명사',body:`<h4>명사 자리 빠른 확인</h4><ul><li>주어·목적어·보어 자리에 명사가 올 수 있습니다.</li><li>관사(a/an/the), 소유격, 형용사 뒤에는 명사가 오는 경우가 많습니다.</li><li>관사/소유격 + (부사) + (형용사) + 명사: <b>관·소·부·형·명</b> 순서를 기억하세요.</li><li>명사 + 명사 복합명사에서는 뒤 명사가 가산/불가산 및 단·복수를 결정합니다.</li></ul><h4>가산·불가산 주의</h4><p>information, advice, luggage/baggage, stationery, merchandise, funding, access, furniture, assistance, produce, equipment, news는 대표적인 불가산명사입니다. task/work, permit/permission, certificate/certification, seat/seating의 차이도 구분합니다.</p><h4>사람 명사와 사물 명사</h4><p>applicant/application, assistant/assistance, participant/participation, correspondent/correspondence, manager/management, investor/investment, founder/foundation, manufacturer/manufacturing을 비교해 암기합니다.</p><h4>대명사</h4><ul><li>주격은 주어, 목적격은 동사·전치사의 목적어, 소유격은 명사 앞에 씁니다.</li><li>소유대명사는 소유격+명사를 대신하므로 뒤에 명사를 다시 쓰지 않습니다.</li><li>재귀대명사는 주어와 목적어가 같을 때 목적어로 쓰거나, 강조 용법으로 생략 가능합니다.</li><li>this/that은 단수, these/those는 복수 동사와 호응합니다.</li><li>those who + 복수동사 / anyone who + 단수동사.</li><li>some은 주로 긍정문, any는 부정·의문·조건문에 자주 쓰이며 권유 의문문에서는 some이 가능합니다.</li></ul><p><b>예문:</b> We hired a qualified accountant. / She handled the issue herself.</p>`},
{title:'02. 형용사와 부사',sub:'수식 위치 · 수량 형용사 · 혼동 어휘 · 부사 위치',body:`<h4>형용사</h4><ul><li>명사 앞: 관사/소유격/한정사 + (부사) + 형용사 + 명사.</li><li>명사 뒤: 명사 + 형용사 + 전치사구/to부정사. 예: information irrelevant to the topic.</li><li>2형식 동사(be, become, seem, stay, remain, sound, feel, look) 뒤에는 형용사 보어가 올 수 있습니다.</li><li>5형식 동사(keep, find, consider, make, leave) + 목적어 + 형용사.</li></ul><h4>수량 형용사</h4><p>each/every/another/either/neither + 단수명사 · many/a few/fewer/both/several + 복수명사 · much/a little/less + 불가산명사. a few/a little은 조금 있는, few/little은 거의 없는 의미입니다.</p><p>a number of + 복수명사 + 복수동사 / the number of + 복수명사 + 단수동사.</p><h4>부사</h4><p>부사는 동사·형용사·부사·문장 전체를 수식합니다. 빈도부사는 be동사/조동사 뒤, 일반동사 앞에 놓입니다.</p><ul><li>hard: 열심히/세게 · hardly: 거의 ~않다</li><li>high: 높이 · highly: 매우/높이 평가하여</li><li>close: 가까이 · closely: 면밀히</li><li>late: 늦게 · lately: 최근에</li></ul><p>hardly, rarely, seldom, scarcely, barely는 자체로 부정 의미가 있어 not과 중복하지 않습니다.</p>`},
{title:'03. 동사: 수일치·태·시제',sub:'동사 자리 → 가짜 동사 제거 → 수일치 → 능동/수동 → 시제',body:`<h4>수일치</h4><ul><li>단수 주어 + 단수 동사 / 복수 주어 + 복수 동사.</li><li>전치사구·관계절 등 수식어구에 속지 말고 핵심 주어를 찾습니다.</li><li>조동사 + 동사원형, Please + 동사원형.</li><li>to부정사구·동명사구·that절은 주어일 때 보통 단수 취급합니다.</li></ul><h4>능동태와 수동태</h4><p>주어가 행하면 능동, 주어가 동작을 받으면 be + p.p. 수동입니다. 수동태의 목적어 유무와 주어-동사의 의미 관계를 함께 확인합니다.</p><p>빈출: be surprised at, be satisfied with, be filled with, be equipped with, be involved in, be interested in, be known for/as, be based on/in.</p><h4>시제 단서</h4><ul><li>현재/반복: always, usually, generally, every, frequently, regularly.</li><li>과거: previously, formerly, ago, once, last + 시점.</li><li>미래: shortly, soon, tomorrow, next + 시점, in + 기간.</li><li>현재완료: since + 과거 시점, lately/recently, so far, over the last/past + 기간.</li><li>과거완료: 과거 기준 시점보다 더 먼저 완료된 일.</li><li>미래완료: by + 미래 시점까지 완료될 일.</li></ul><p>시간·조건 부사절(when, as soon as, if, unless, once 등)은 미래 의미라도 현재시제를 씁니다.</p><h4>동사 문제 풀이 순서</h4><p><b>자리 → 가짜 동사 제거 → 수일치 → 태 → 시제</b> 순서로 선택지를 좁힙니다.</p>`},
{title:'04. 전치사',sub:'시간·장소·기간·이유·양보·관용 표현',body:`<h4>헷갈리는 짝</h4><ul><li>at + 구체적 시각/지점 · on + 날짜/요일/접촉면 · in + 월/연도/도시/공간 안.</li><li>until: 상태가 계속되는 끝 시점 / by: 그때까지 완료해야 하는 마감.</li><li>during + 특정 기간 명사 / for + 숫자로 된 기간.</li><li>between: 둘 사이 / among: 셋 이상 또는 집단 안.</li><li>since + 과거 시점은 현재완료와 자주 결합합니다.</li><li>despite/in spite of + 명사·동명사, because of/due to/owing to + 명사.</li></ul><h4>전치사 뒤 형태</h4><p>전치사 뒤에는 명사·대명사·동명사가 옵니다. during/throughout/over는 명사구를 취하며, upon + 동명사는 '~하자마자' 의미로 쓰입니다.</p><h4>빈출 표현</h4><p>in accordance with(~에 따라), in compliance with(~을 준수하여), in charge of(~을 담당하는), on behalf of(~을 대표하여), in light of(~을 고려하여), ahead of schedule(예정보다 일찍), at one's earliest convenience(가능한 한 빠른 시일 내에).</p>`},
{title:'05. 접속사·접속부사',sub:'완전한 절인지 명사구인지 먼저 확인',body:`<h4>부사절 접속사</h4><p>접속사 뒤에는 주어+동사가 있는 완전한 절이 옵니다. 시간(when, while, once, as soon as), 조건(if, unless, as long as, provided that), 이유(because, since, now that), 양보(although, even though, whereas), 목적(so that, in order that)을 의미별로 정리합니다.</p><h4>전치사와 접속사 구분</h4><p>during + 명사 / while + 주어+동사. because of + 명사 / because + 주어+동사. despite + 명사 / although + 주어+동사.</p><h4>명사절 접속사</h4><p>that/whether/if는 명사절을 이끌 수 있지만, 전치사 뒤에는 whether가 가능하고 if는 일반적으로 불가합니다. 의문사 뒤에는 문장 성분이 빠졌는지 확인합니다.</p><h4>접속부사</h4><p>however, therefore, moreover, consequently 등은 부사이므로 단독으로 두 절을 연결하지 않습니다. 마침표/세미콜론 뒤에서 문장 연결 기능을 합니다.</p><h4>상관접속사</h4><p>both A and B(복수 동사), either A or B / neither A nor B(가까운 주어에 수일치), not only A but also B(B에 수일치).</p>`},
{title:'06. 관계사',sub:'선행사 + 관계사 뒤 문장 구조 확인',body:`<h4>관계대명사</h4><p>사람: who/whom/whose · 사물: which/whose · 사람·사물: that. 주격 뒤에는 동사, 목적격 뒤에는 주어+동사(목적어 빠짐), 소유격 뒤에는 명사가 옵니다.</p><h4>관계부사</h4><p>when(시간), where(장소), why(이유), how(방법)는 뒤에 완전한 문장이 옵니다. 관계대명사는 불완전한 문장 구조와 대비합니다.</p><p>주격 관계대명사 + be동사는 함께 생략될 수 있고, 목적격 관계대명사는 생략될 수 있습니다. Those who + 복수동사 / anyone who + 단수동사.</p>`},
{title:'07. to부정사·동명사·분사',sub:'목적어로 취하는 형태와 수식 관계 구별',body:`<h4>to부정사</h4><p>명사적(~하는 것), 형용사적(~하기 위한), 부사적(목적·이유) 용법이 있습니다. wish, hope, plan, agree, decide, expect, manage, intend, afford, refuse, promise, need, want 등은 to부정사를 목적어로 취합니다.</p><p>ability, effort, chance, opportunity, decision, plan, willingness, reason + to V. request/require/remind/invite/instruct/convince/enable/encourage/permit/ask/allow/advise + 목적어 + to V.</p><h4>동명사</h4><p>동명사는 명사 역할만 하며 주어·목적어·전치사 목적어가 됩니다. mind, postpone, put off, finish, delay, enjoy, avoid, give up, practice, recommend, dislike, admit, suggest, risk, consider + -ing.</p><p>by/upon/without/after/prior to/despite + -ing, have difficulty -ing, be worth -ing, be capable of -ing.</p><h4>분사</h4><p>현재분사 V-ing는 능동·진행, 과거분사 p.p.는 수동·완료 의미로 명사를 수식합니다. 감정 분사는 사물(감정을 유발)=interesting, 사람(감정을 느낌)=interested.</p><p>후치수식에서 목적어가 뒤에 오면 V-ing, 전치사구/부사구가 뒤에 오면 p.p.가 자주 쓰입니다. 자동사는 수동태가 없으므로 rising, remaining, growing 등 현재분사만 가능합니다.</p><h4>분사구문</h4><p>부사절의 주어가 주절 주어와 같을 때 접속사·주어를 줄이고 V-ing로 만드는 방식입니다. 주어가 동작을 받으면 p.p. 형태를 씁니다. unless otherwise stated/noted, as scheduled/requested/expected, when necessary/possible 등을 묶어 암기합니다.</p>`},
{title:'08. 비교구문',sub:'원급·비교급·최상급과 강조 표현',body:`<h4>원급</h4><p>as + 형용사/부사 + as. 수량은 as many + 복수명사 + as / as much + 불가산명사 + as.</p><h4>비교급</h4><p>more + 형용사/부사 + than. 비교급 강조: a lot, even, much, still, far, considerably, significantly.</p><p>the 비교급 ~, the 비교급 ~(~할수록 더 ~하다). the 비교급 + of the two(둘 중 더 ~한).</p><h4>최상급</h4><p>the/소유격 + 최상급 + 명사. one of the + 최상급 + 복수명사. 강조: by far, so far, yet, quite.</p><h4>불규칙</h4><p>good/well–better–best, bad/ill–worse–worst, many/much–more–most, little–less–least.</p>`},
{title:'09. Part 5 실전 풀이 루틴',sub:'선택지 먼저 보기 · 문장 구조 · 근거 확인',body:`<ol><li><b>선택지를 먼저 훑기:</b> 품사·형태가 다르면 문법 문제, 의미가 다르면 어휘 문제인지 가릅니다.</li><li><b>빈칸 주변 구조 확인:</b> 빈칸 앞뒤에서 필요한 품사, 절/구 구조, 수식 관계를 판단합니다.</li><li><b>동사 문제는 순서대로:</b> 자리 → 가짜 동사 → 수일치 → 태 → 시제.</li><li><b>전치사/접속사 구분:</b> 뒤가 명사구인지 완전한 절인지 확인합니다.</li><li><b>정답 근거 복습:</b> 맞혔더라도 왜 정답인지, 오답은 어떤 규칙과 충돌하는지 설명할 수 있어야 합니다.</li></ol><p>영상은 00:00 명사·대명사, 47:54 수일치·능동/수동·시제, 1:33:17 형용사·부사, 2:23:14 전치사·접속사, 3:16:30 명사절·형용사절, 4:03:48 접속부사, 4:32:27 준동사, 5:19:13 분사구문·비교구문 순으로 구성되어 있습니다.</p>`}
];
function studyScreen(){const el=$('part5');el.innerHTML=`<div class="row"><h2 class="section-title">Part 5 문법 총정리</h2><button class="btn soft" onclick="setPartView('menu')">뒤로</button></div><div class="card"><p class="small muted">제공해 주신 문법 정리 PDF 4종과 영상의 공개 목차·요약을 바탕으로 재구성한 학습 노트입니다. 제목을 눌러 필요한 단원만 펼쳐 학습하세요.</p><a class="btn full" style="display:block;text-align:center;text-decoration:none" href="https://www.youtube.com/watch?v=3hm7qJDcHCM" target="_blank" rel="noopener">참고 영상 열기 ↗</a></div>${STUDY.map((x,i)=>`<details class="card" ${i===0?'open':''}><summary style="font-weight:800;cursor:pointer;line-height:1.5">${x.title}<div class="small muted" style="font-weight:400;margin-top:4px">${x.sub}</div></summary><div style="line-height:1.75;font-size:13px;margin-top:14px">${x.body}</div></details>`).join('')}<div class="card"><b>학습한 내용 바로 테스트하기</b><p class="small muted">문법 총정리에서 다룬 개념은 Part 5 문제은행에 반영되어 있습니다.</p><button class="btn primary full" onclick="setPartView('test')">Test로 이동</button></div>`}

// Phrase quiz: five multiple-choice questions per session, with saved progress and phrase bookmarks.
function startPhraseTest(){phraseQuizMode=true;let old=state.phraseSession;if(old&&!old.done){phraseQuizIndex=old.index||0;show('words');return}const all=PHRASES.map((p,i)=>({id:String(i),p}));const rec=new Set((state.recentPhraseIds||[]));let pool=all.filter(x=>!rec.has(x.id));if(pool.length<5){state.recentPhraseIds=[];pool=all}const pick=pool.sort(()=>Math.random()-.5).slice(0,5);state.phraseSession={deck:pick.map(x=>x.id),index:0,answers:{},done:false};state.recentPhraseIds=[...(state.recentPhraseIds||[]),...pick.map(x=>x.id)].slice(-80);phraseQuizIndex=0;persist();show('words')}
function answerPhrase(i){const s=state.phraseSession;if(!s||s.done)return;const id=s.deck[s.index],p=PHRASES[+id];if(s.answers[id])return;const ok=i===s.answers[id]?.correctIndex;const opts=s.currentOptions||[];const right=opts.indexOf(p[1]);const good=i===right;s.answers[id]={choice:i,ok:good,options:opts};if(!good){const z=state.wrongPhrases[id]||{count:0};z.count++;state.wrongPhrases[id]=z}persist();phraseQuizScreen()}
function phraseQuizScreen(){const el=$('words'),s=state.phraseSession;if(!s){el.innerHTML='<div class="card">빈출 구문 테스트가 없습니다.</div>';return}if(s.done){const total=s.deck.length,score=s.deck.filter(id=>s.answers[id]?.ok).length;el.innerHTML=`<h2 class="section-title">빈출 구문 테스트 결과</h2><div class="card"><div class="score">${score}/${total}</div><p>정답 ${score}개 · 오답 ${total-score}개 · 정답률 ${Math.round(score/total*100)}%</p></div>${s.deck.map((id,i)=>{const p=PHRASES[+id],a=s.answers[id];return `<div class="card"><b>${i+1}. ${a.ok?'✓ 정답':'✕ 오답'}</b><p>${p[0]}</p><p>정답: ${p[1]}</p><p class="small muted">${p[2]}</p></div>`}).join('')}<button class="btn primary full" onclick="state.phraseHistory.push({score:${score},total:${total},date:new Date().toLocaleString('ko-KR')});state.phraseSession=null;phraseQuizMode=false;persist();wordScreen()">완료</button>`;return}const id=s.deck[s.index],p=PHRASES[+id],ans=s.answers[id];let options=ans?.options;if(!options){const distractors=[...new Set(PHRASES.filter((x,i)=>i!==+id&&x[1]!==p[1]).map(x=>x[1]))].sort(()=>Math.random()-.5).slice(0,3);options=[p[1],...distractors].sort(()=>Math.random()-.5);s.currentOptions=options;persist()}const right=options.indexOf(p[1]);el.innerHTML=`<div class="row"><h2 class="section-title">빈출 구문 뜻 고르기</h2><span class="tag">${s.index+1}/5</span></div><div class="progress"><i style="width:${(s.index+1)/5*100}%"></i></div><div class="card"><div class="word" style="font-size:25px">${esc(p[0])}</div><p class="small muted">알맞은 한국어 뜻을 선택하세요.</p>${options.map((v,i)=>`<button class="choice ${ans&&i===right?'correct':''} ${ans&&i===ans.choice&&i!==right?'wrong':''}" ${ans?'disabled':''} onclick="answerPhrase(${i})">${i+1}. ${esc(v)}</button>`).join('')}${ans?`<div class="feedback ${ans.ok?'ok':'no'}"><b>${ans.ok?'✓ 정답':'✕ 오답'}</b><br>정답: ${esc(p[1])}<br><span class="small">예문: ${esc(p[2])}</span></div><button class="btn primary full" onclick="nextPhrase()">${s.index===4?'결과 확인':'다음 문제 →'}</button>`:''}<button class="btn full" style="margin-top:8px" onclick="togglePhraseSave('${id}')">${state.savedPhrases.includes(id)?'★ 보관 해제':'☆ 구문 보관하기'}</button></div><button class="btn full" onclick="phraseQuizMode=false;wordScreen()">학습 메뉴</button>`}
function nextPhrase(){const s=state.phraseSession;if(s.index<4){s.index++;s.currentOptions=null;persist();phraseQuizScreen()}else{s.done=true;persist();phraseQuizScreen()}}
function togglePhraseSave(id){if(state.savedPhrases.includes(id))state.savedPhrases=state.savedPhrases.filter(x=>x!==id);else state.savedPhrases.push(id);persist();phraseQuizScreen();toast('구문 보관함을 업데이트했습니다.')}
function phraseWrongReview(){const ids=Object.keys(state.wrongPhrases);if(!ids.length){toast('복습할 구문 오답이 없습니다.');return}const deck=ids.slice(0,5);if(deck.length<5){const extra=PHRASES.map((p,i)=>String(i)).filter(id=>!deck.includes(id)).sort(()=>Math.random()-.5).slice(0,5-deck.length);deck.push(...extra)}state.phraseSession={deck,index:0,answers:{},done:false};phraseQuizMode=true;persist();show('words')}
function removePhraseSaved(id){state.savedPhrases=state.savedPhrases.filter(x=>x!==id);persist();phraseSavedReview()}
function phraseSavedReview(){if(!state.savedPhrases.length){toast('보관한 구문이 없습니다.');return}phraseQuizMode=false;const el=$('words');el.innerHTML=`<div class="row"><h2 class="section-title">내 빈출 구문 보관함</h2><button class="btn soft" onclick="wordScreen()">뒤로</button></div>${state.savedPhrases.map(id=>{const p=PHRASES[+id];return `<div class="card"><b>${esc(p[0])}</b><p>${esc(p[1])}</p><p class="small muted">${esc(p[2])}</p><button class="btn" onclick="removePhraseSaved('${id}')">보관 해제</button></div>`}).join('')}`}
let wordScreen=baseWordScreen;wordScreen=function(){if(phraseQuizMode){phraseQuizScreen();return}baseWordScreen();const el=$('words');if(!deck.length){el.innerHTML=el.innerHTML.replace('onclick="startPhrases()"','onclick="startPhraseTest()"').replace('빈출 구문 학습','빈출 구문 뜻 고르기 (5문제)');el.innerHTML+=`<div class="card"><div class="row"><b>빈출 구문 테스트</b><span class="tag">${PHRASES.length}개</span></div><p class="small muted">영어 구문을 보고 알맞은 한국어 뜻을 고르는 5문제 테스트</p>${state.phraseSession&&!state.phraseSession.done?`<button class="btn primary full" onclick="phraseQuizMode=true;show('words')">이어서 풀기 (${state.phraseSession.index+1}/5)</button>`:''}<button class="btn primary full" style="margin-top:8px" onclick="startPhraseTest()">5문제 테스트 시작</button><div class="grid" style="margin-top:8px"><button class="btn" onclick="phraseSavedReview()">보관함 (${state.savedPhrases.length})</button><button class="btn" onclick="phraseWrongReview()">구문 오답 (${Object.keys(state.wrongPhrases).length})</button></div></div>`}}
let reviewScreen=baseReviewScreen;reviewScreen=function(){baseReviewScreen();const el=$('review');el.innerHTML+=`<div class="card"><div class="row"><b>빈출 구문 보관함</b><span class="tag">${state.savedPhrases.length}개</span></div>${state.savedPhrases.length?state.savedPhrases.map(id=>{const p=PHRASES[+id];return `<div class="listitem"><b>${esc(p[0])}</b><div class="small muted">${esc(p[1])}</div></div>`}).join(''):'<p class="small muted">보관한 구문이 없습니다.</p>'}<button class="btn full" onclick="phraseSavedReview();show('words')">구문 보관함 열기</button></div><div class="card"><div class="row"><b>빈출 구문 오답</b><span class="tag">${Object.keys(state.wrongPhrases).length}개</span></div>${Object.entries(state.wrongPhrases).map(([id,v])=>{const p=PHRASES[+id];return p?`<div class="listitem"><b>${esc(p[0])}</b><div class="small muted">${esc(p[1])} · 오답 ${v.count}회</div></div>`:''}).join('')||'<p class="small muted">구문 오답이 없습니다.</p>'}<button class="btn full" onclick="phraseWrongReview();show('words')">구문 오답 다시 풀기</button></div>`}

</script>
</body></html>
